<!DOCTYPE html>
<html lang="vi">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Hai×bo · Dame TikTok</title>
<style>
  :root { --bg:#0a0a0f; --panel:#15151e; --cyan:#00e5ff; --pink:#ff007f; --green:#00e676; --txt:#fff; }
  * { box-sizing:border-box; font-family:system-ui, sans-serif; margin:0; padding:0; }
  body { background:radial-gradient(circle at 50% -20%, #1a0033 0%, var(--bg) 80%); color:var(--txt); display:flex; justify-content:center; padding:20px; min-height:100vh; }
  .app { width:100%; max-width:600px; }
  .header { text-align:center; margin-bottom:20px; }
  .header h1 { color:var(--cyan); text-shadow:0 0 15px var(--cyan); font-size:2rem; letter-spacing:2px; }
  .card { background:var(--panel); padding:20px; border-radius:12px; border:1px solid #333; margin-bottom:20px; box-shadow:0 10px 30px rgba(0,0,0,0.5); }
  h2 { font-size:1rem; color:var(--pink); border-bottom:1px solid #333; padding-bottom:10px; margin-bottom:15px; text-transform:uppercase; }
  input, select { width:100%; padding:12px; margin-bottom:10px; background:#000; border:1px solid #333; color:#fff; border-radius:8px; outline:none; font-family:inherit; }
  input:focus, select:focus { border-color:var(--cyan); }
  button { width:100%; padding:14px; border:none; border-radius:8px; font-weight:bold; font-size:1rem; cursor:pointer; transition:0.2s; margin-bottom:10px; font-family:inherit; }
  .btn-main { background:linear-gradient(90deg, var(--pink), var(--cyan)); color:#fff; }
  .btn-main:hover { transform:scale(1.02); }
  .btn-green { background:var(--green); color:#000; }
  .btn-red { background:#ff5252; color:#fff; }
  .btn-yel { background:#ffd700; color:#000; }
  .hidden { display:none!important; }
  .msg { padding:10px; border-radius:6px; font-size:0.85rem; font-weight:bold; margin-top:10px; text-align:center; }
  .msg.err { background:rgba(255,82,82,0.1); color:#ff5252; border:1px solid #ff5252; }
  .msg.ok { background:rgba(0,230,118,0.1); color:var(--green); border:1px solid var(--green); }
  .header-bar { display:flex; justify-content:space-between; align-items:center; background:rgba(0,0,0,0.5); padding:15px; border-radius:10px; border:1px solid #333; margin-bottom:20px; }
  .balance { color:#ffd700; font-weight:bold; font-size:1.2rem; }
  .bank-box { background:rgba(0,229,255,0.05); padding:15px; border:1px dashed var(--cyan); border-radius:8px; margin-bottom:15px; line-height:1.6; }
  .loading { display:inline-block; width:15px; height:15px; border:3px solid rgba(255,255,255,0.3); border-radius:50%; border-top-color:#fff; animation:spin 1s infinite; vertical-align:middle; margin-right:5px; }
  @keyframes spin { to { transform:rotate(360deg); } }
  .status-box { margin-top:15px; padding:15px; background:#000; border-radius:8px; border:1px solid #333; text-align:center; }
</style>
</head>
<body>
<div class="app">
  <div class="header"><h1>DAME TIKTOK VIP</h1></div>

  <div id="authView" class="card">
    <h2>Đăng Nhập / Đăng Ký</h2>
    <input id="uName" placeholder="Tài khoản">
    <input id="uPass" type="password" placeholder="Mật khẩu">
    <button class="btn-main" onclick="Auth.login()">ĐĂNG NHẬP</button>
    <button class="btn-green" onclick="Auth.register()">ĐĂNG KÝ</button>
    <div id="authMsg" class="msg hidden"></div>
  </div>

  <div id="mainView" class="hidden">
    <div class="header-bar">
      <div>Chào, <b id="uiName" style="color:var(--cyan)"></b></div>
      <div class="balance">💰 <span id="uiXu">0</span> VNĐ</div>
      <button class="btn-red" style="width:auto; padding:8px 12px; font-size:0.8rem; margin:0;" onclick="location.reload()">Thoát</button>
    </div>

    <div class="card">
      <h2>Kiểm Tra Trạng Thái Acc TikTok</h2>
      <input id="checkLink" placeholder="Nhập link hoặc username TikTok...">
      <button class="btn-yel" id="btnCheck" onclick="Tracker.startCheck()">🔍 CHECK TRẠNG THÁI & AUTO REFRESH</button>
      <div id="checkStatus" class="status-box hidden">
        <div id="checkResult" style="font-size:1.2rem; font-weight:bold; margin-bottom:5px;">Đang khởi tạo...</div>
        <div style="font-size:0.8rem; color:#888;">Tự động cập nhật sau mỗi 3 giây...</div>
      </div>
    </div>

    <div class="card">
      <h2>Gửi Lệnh Dame</h2>
      <p style="font-size:0.85rem; color:#ffd700; margin-bottom:10px;">📢 Ghi chú: Tài Khoản Riêng Tư là 50k vì khó die.</p>
      <input id="targetLink" placeholder="Nhập link hoặc username TikTok...">
      <button class="btn-main" id="btnDame" onclick="Dame.execute()">🚀 DAME NGAY (Trừ 20k / 50k)</button>
      <div id="dameMsg" class="msg hidden"></div>
    </div>

    <div class="card">
      <h2>Nạp Tiền</h2>
      <div class="row" style="display:flex; gap:10px; margin-bottom:10px;">
        <select id="depMethod" onchange="UI.toggleMethod()" style="flex:1; margin:0;">
          <option value="card">Thẻ Cào</option>
          <option value="bank">Chuyển Khoản</option>
        </select>
        <select id="depAmount" style="flex:1; margin:0;">
          <option value="20000">20.000đ</option>
          <option value="50000">50.000đ</option>
          <option value="100000">100.000đ</option>
          <option value="200000">200.000đ</option>
          <option value="500000">500.000đ</option>
        </select>
      </div>

      <div id="formCard">
        <select id="cardType" style="margin-bottom:10px;">
          <option value="Viettel">Viettel</option>
          <option value="Vina">VinaPhone</option>
          <option value="Mobi">Mobifone</option>
        </select>
        <input id="cardSerial" placeholder="Số Serial (10-15 số)" maxlength="15">
        <input id="cardPin" placeholder="Mã thẻ (PIN) (10-15 số)" maxlength="15">
        <button class="btn-green" onclick="Dame.depositCard()">GỬI THẺ CÀO</button>
      </div>

      <div id="formBank" class="hidden">
        <div class="bank-box">
          <p>Ngân hàng: <b>LPBank</b></p>
          <p>Số TK: <b>0868866580</b></p>
          <p>Chủ TK: <b>MA VAN HUNG</b></p>
          <p>Nội dung CK: <b id="bankCode" style="color:#ffd166">...</b></p>
        </div>
        <button class="btn-green" onclick="Dame.depositBank()">XÁC NHẬN ĐÃ CHUYỂN</button>
      </div>
      <div id="depMsg" class="msg hidden"></div>
    </div>
  </div>
</div>

<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-app-compat.js"></script>
<script src="https://www.gstatic.com/firebasejs/10.8.0/firebase-database-compat.js"></script>

<script>
  window.onerror = function(msg, url, line) { alert("LỖI JS: " + msg + "\nDòng: " + line); };

  const firebaseConfig = {
    apiKey: "AIzaSyAaQg91q7wMeQ4kXyCnOQuolvN_KmJoHBI",
    authDomain: "vip1-c45cb.firebaseapp.com",
    projectId: "vip1-c45cb",
    storageBucket: "vip1-c45cb.firebasestorage.app",
    messagingSenderId: "191209527323",
    appId: "1:191209527323:web:b908c85ad00bfb6c2ac0be",
    databaseURL: "https://vip1-c45cb-default-rtdb.asia-southeast1.firebasedatabase.app"
  };
  firebase.initializeApp(firebaseConfig);
  const db = firebase.database();

  const DISCORD_WEBHOOK = "https://discord.com/api/webhooks/1561068482504691742/R5_eAJ4B5QaQ7iGpCORqd8ZPwTiYDVJuUucjiiYqaMS4NjfN-zQ6cAvupv-IW9lN54Ke";

  function notifyDiscord(title, user, amount, info) {
    fetch(DISCORD_WEBHOOK, {
      method: "POST", headers: { "Content-Type": "application/json" },
      body: JSON.stringify({
        username: "Hai×bo System",
        embeds: [{ title: title, color: 16711935, fields: [
          { name: "User", value: user, inline: true },
          { name: "Số tiền", value: amount.toLocaleString() + "đ", inline: true },
          { name: "Thông tin", value: info, inline: false }
        ], timestamp: new Date().toISOString()}]
      })
    }).catch(e => console.log(e));
  }

  let currentUser = null;
  let userIP = "Đang lấy...";
  fetch('https://api.ipify.org?format=json').then(r=>r.json()).then(d=>userIP=d.ip).catch(()=>userIP="Lỗi IP");

  const UI = {
    msg(id, txt, isErr) {
      const el = document.getElementById(id);
      el.innerHTML = txt; el.className = `msg ${isErr ? 'err' : 'ok'}`;
      el.classList.remove('hidden');
      setTimeout(() => el.classList.add('hidden'), 5000);
    },
    toggleMethod() {
      const m = document.getElementById('depMethod').value;
      document.getElementById('formCard').classList.toggle('hidden', m !== 'card');
      document.getElementById('formBank').classList.toggle('hidden', m !== 'bank');
    }
  };

  const Auth = {
    register() {
      const u = document.getElementById('uName').value.trim();
      const p = document.getElementById('uPass').value.trim();
      if(!u || !p) return UI.msg('authMsg', "Nhập đủ tên/pass", 1);

      db.ref('users').once('value').then(snap => {
        let users = snap.val() || {};
        if(Object.values(users).find(x => x.username === u)) return UI.msg('authMsg', "Tên đã tồn tại", 1);

        const newRef = db.ref('users').push();
        newRef.set({
          id: newRef.key, username: u, password: p, balance: 0, 
          bankCode: 'DAME' + Math.floor(1000 + Math.random() * 9000), ip: userIP
        }).then(() => UI.msg('authMsg', "Đăng ký thành công!", 0));
      });
    },
    login() {
      const u = document.getElementById('uName').value.trim();
      const p = document.getElementById('uPass').value.trim();
      db.ref('users').once('value').then(snap => {
        let user = Object.values(snap.val() || {}).find(x => x.username === u && x.password === p);
        if(!user) return UI.msg('authMsg', "Sai tài khoản/pass", 1);

        currentUser = user;
        document.getElementById('authView').classList.add('hidden');
        document.getElementById('mainView').classList.remove('hidden');
        Auth.render();
      });
    },
    render() {
      db.ref('users/' + currentUser.id).once('value').then(snap => {
        if(snap.exists()) {
          currentUser = snap.val();
          document.getElementById('uiName').textContent = currentUser.username;
          document.getElementById('uiXu').textContent = (currentUser.balance || 0).toLocaleString();
          document.getElementById('bankCode').textContent = currentUser.bankCode;
        }
      });
    }
  };

  // ================== THUẬT TOÁN CHECK ACC (MÔ PHỎNG) ==================
  let checkInterval = null;
  const Tracker = {
    startCheck() {
      const link = document.getElementById('checkLink').value.trim();
      if(!link) return alert("Nhập link acc cần check đi mày!");
      
      const statusBox = document.getElementById('checkStatus');
      const result = document.getElementById('checkResult');
      const btn = document.getElementById('btnCheck');
      
      statusBox.classList.remove('hidden');
      btn.disabled = true;
      btn.innerHTML = `⏳ ĐANG THEO DÕI...`;
      
      if(checkInterval) clearInterval(checkInterval);
      
      let count = 0;
      result.style.color = "#ffd700";
      result.innerHTML = `Đang kết nối đến [${link}]...`;
      
      checkInterval = setInterval(() => {
        count++;
        if(count === 1) {
          result.style.color = "#00e5ff";
          result.innerHTML = `🟢 Trạng thái: ĐANG SỐNG (Bình thường)`;
        } else if(count === 2) {
          result.style.color = "#ffd700";
          result.innerHTML = `🟡 Trạng thái: BỊ HẠN CHẾ (Cảnh báo)`;
        } else if(count === 3) {
          result.style.color = "#ff5252";
          result.innerHTML = `🔴 Trạng thái: ĐÃ DIE (Bay màu)`;
          clearInterval(checkInterval);
          btn.disabled = false;
          btn.innerHTML = `🔍 CHECK LẠI & AUTO REFRESH`;
        } else {
          clearInterval(checkInterval);
          btn.disabled = false;
          btn.innerHTML = `🔍 CHECK TRẠNG THÁI & AUTO REFRESH`;
        }
      }, 3000); // Cập nhật mỗi 3 giây
    }
  };

  const Dame = {
    execute() {
      const target = document.getElementById('targetLink').value.trim();
      if(!target) return UI.msg('dameMsg', "Nhập link hoặc username cần dame!", 1);
      
      // Mặc định lấy giá 20k, nếu acc riêng tư thì 50k
      let price = 20000;
      if(target.toLowerCase().includes("private") || target.toLowerCase().includes("riengtu")) {
        price = 50000;
      }

      if((currentUser.balance || 0) < price) return UI.msg('dameMsg', `Số dư không đủ ${price.toLocaleString()}đ! Nạp thêm đi.`, 1);

      const btn = document.getElementById('btnDame');
      btn.innerHTML = `<span class="loading"></span> ĐANG GỬI LỆNH...`;
      btn.disabled = true;

      db.ref('users/' + currentUser.id).update({ balance: currentUser.balance - price }).then(() => {
        currentUser.balance -= price;
        Auth.render();

        const newOrder = db.ref('dame_orders').push();
        newOrder.set({
          id: newOrder.key, userId: currentUser.id, username: currentUser.username,
          target: target, price: price, status: 'processing', time: Date.now()
        }).then(() => {
          notifyDiscord("🚨 CÓ LỆNH DAME MỚI", currentUser.username, price, "Target: " + target);
          
          setTimeout(() => {
            UI.msg('dameMsg', `✅ Đã tiếp nhận lệnh dame cho [${target}]. Giá: ${price.toLocaleString()}đ. Chờ Admin xử lý!`, 0);
            btn.innerHTML = `🚀 DAME NGAY (Trừ 20k / 50k)`;
            btn.disabled = false;
            document.getElementById('targetLink').value = "";
          }, 1500);
        });
      });
    },
    depositCard() {
      if(!currentUser) return;
      const type = document.getElementById('cardType').value;
      const amount = parseInt(document.getElementById('depAmount').value);
      const serial = document.getElementById('cardSerial').value.trim();
      const pin = document.getElementById('cardPin').value.trim();

      if(!serial || !pin) return UI.msg('depMsg', "Nhập đủ Serial và Mã thẻ", 1);
      if(serial.length < 10 || serial.length > 15 || pin.length < 10 || pin.length > 15) {
        return UI.msg('depMsg', "Serial và PIN phải từ 10-15 số!", 1);
      }

      const newDep = db.ref('deposits').push();
      let infoText = `${type} - S:${serial} - P:${pin}`;
      
      newDep.set({
        id: newDep.key, userId: currentUser.id, username: currentUser.username,
        amount: amount, method: 'Thẻ Cào', info: infoText, 
        status: 'pending', created_at: Date.now()
      }).then(() => {
        notifyDiscord("💳 NẠP THẺ CÀO MỚI", currentUser.username, amount, infoText);
        UI.msg('depMsg', "Đã gửi thẻ cào, chờ Admin duyệt!", 0);
        document.getElementById('cardSerial').value = "";
        document.getElementById('cardPin').value = "";
      });
    },
    depositBank() {
      if(!currentUser) return;
      const amount = parseInt(document.getElementById('depAmount').value);

      const newDep = db.ref('deposits').push();
      newDep.set({
        id: newDep.key, userId: currentUser.id, username: currentUser.username,
        amount: amount, method: 'Bank', info: `Nội dung: ${currentUser.bankCode}`, 
        status: 'pending', created_at: Date.now()
      }).then(() => {
        notifyDiscord("💰 CHUYỂN KHOẢN MỚI", currentUser.username, amount, `Mã CK: ${currentUser.bankCode}`);
        UI.msg('depMsg', "Đã ghi nhận, chờ Admin check bill!", 0);
      });
    }
  };
</script>
</body>
</html>
